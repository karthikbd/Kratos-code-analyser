[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kratos-code-analyzer"
version = "1.0.0"
description = "FDIC Part 370 Deep Code Analyzer - 6-Layer Compliance Pipeline for Covered Institutions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "networkx>=3.3",
    "python-dateutil>=2.9",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "langchain-core>=0.2",
    "langgraph>=0.1",
    "openai>=1.30",
    "faiss-cpu",
    "tiktoken",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv",
]

[project.scripts]
kratos = "backend.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
